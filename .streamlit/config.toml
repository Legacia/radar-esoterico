[server]
address = "0.0.0.0"
port = 8501
headless = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

# Visual baseado na referência de interface aprovada pelo Legacia (ERT Engagement Monitor).
[theme]
base = "light"
primaryColor = "#24406f"
backgroundColor = "#f3f5f8"
secondaryBackgroundColor = "#ffffff"
textColor = "#1f2a37"
linkColor = "#2f6fdb"
borderColor = "#d8dde5"
dataframeBorderColor = "#e8ecf1"
dataframeHeaderBackgroundColor = "#f7f9fb"
showWidgetBorder = true
baseRadius = "6px"
buttonRadius = "6px"
baseFontSize = 14
font = "'IBM Plex Sans', 'Segoe UI', Arial, sans-serif:https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap"
headingFontWeights = [600, 600, 600, 600, 600, 600]
headingFontSizes = ["1.6rem", "1.15rem", "1rem", "0.95rem", "0.9rem", "0.85rem"]
redColor = "#b42318"
redBackgroundColor = "#fdecea"
redTextColor = "#b42318"
orangeColor = "#a64b06"
orangeBackgroundColor = "#fdf1e6"
orangeTextColor = "#a64b06"
yellowColor = "#7a6400"
yellowBackgroundColor = "#faf5dc"
yellowTextColor = "#7a6400"
greenColor = "#1e7b46"
greenBackgroundColor = "#e7f5ec"
greenTextColor = "#1e7b46"
blueColor = "#24406f"
blueBackgroundColor = "#eceffa"
blueTextColor = "#3e4c9a"
grayColor = "#6b7686"
grayBackgroundColor = "#eef0f3"
grayTextColor = "#4a5566"
violetColor = "#6a3fa0"
violetBackgroundColor = "#f1ebf8"
violetTextColor = "#6a3fa0"
chartCategoricalColors = ["#3e4c9a", "#0b7a6b", "#a64b06", "#6a3fa0", "#1e7b46", "#b42318", "#6b7686"]

[theme.sidebar]
backgroundColor = "#19222e"
secondaryBackgroundColor = "#2b3a50"
textColor = "#e6ebf2"
primaryColor = "#8fb3ff"
borderColor = "#2b3a50"
linkColor = "#8fb3ff"
