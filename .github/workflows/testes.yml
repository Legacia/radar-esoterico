# Roda os testes a cada envio e em cada pull request. Não usa dados reais nem segredos.
name: Testes

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: windows-latest  # mesmo sistema do servidor do Radar
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # histórico completo, para comparar o pull request com a ramificação de destino
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Instalar dependências
        run: python -m pip install -r requirements.txt
      - name: Conferir dependências
        run: python -m pip check
      - name: Testes
        run: python -m pytest -q
      - name: Conferir espaços em branco no diff
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git diff --check "origin/${{ github.base_ref }}"...HEAD
      - name: Barrar dados e segredos no Git
        shell: bash
        run: |
          proibidos=$(git ls-files | grep -Ei '\.(db|sqlite3?|xlsx?|ods)$|(^|/)\.env$|^data/|^backups/|node_modules/|^web/dist/|\.csv$' | grep -v '^exemplos/' || true)
          if [ -n "$proibidos" ]; then echo "Arquivos que não podem estar no Git:"; echo "$proibidos"; exit 1; fi

  interface:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Instalar dependências
        run: npm ci
      - name: Conferir tipos
        run: npm run tipos
      - name: Testes
        run: npm test
      - name: Montar
        run: npm run build

  ponta-a-ponta:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Instalar dependências do Python
        run: |
          python -m venv .venv
          .venv\Scripts\python.exe -m pip install -r requirements.txt
      - name: Instalar dependências da interface e o navegador de teste
        working-directory: web
        run: |
          npm ci
          npx playwright install chromium
      - name: Montar a interface
        working-directory: web
        run: npm run build
      - name: Teste de ponta a ponta (banco temporário, conta fictícia)
        working-directory: web
        run: npm run e2e
